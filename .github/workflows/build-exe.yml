name: Build EXE

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE (系统托盘版)
        run: pyinstaller --onefile --windowed --name xiaok-ad-helper --icon client/icon.ico --add-data "client/icon.ico;." client/mouse_bridge.py

      - name: Collect EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist\*.exe out\
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaok-ad-helper-exe
          path: out/*.exe
          if-no-files-found: error

      - name: Publish to 'latest' release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "最新构建 (latest)"
          body: |
            自动构建于 SHA ${{ github.sha }}
          files: out/*.exe
          make_latest: true

      - name: Publish to versioned Release (tag 触发)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
